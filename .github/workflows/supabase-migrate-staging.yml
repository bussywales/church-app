name: Deploy Supabase Migrations (Staging)
on:
  push:
    branches: [develop]
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
  workflow_dispatch:
    inputs:
      migration_ref:
        description: Git branch, tag, or commit containing migrations to deploy
        required: true
        default: develop
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-staging-migrations
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      MIGRATION_REF: ${{ inputs.migration_ref }}
    steps:
      - name: Validate manual migration ref
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${MIGRATION_REF}" ]]; then
            echo "migration_ref is required."
            exit 1
          fi

          if [[ "${MIGRATION_REF}" == "main" ]]; then
            echo "Manual staging migration dispatch cannot deploy main."
            exit 1
          fi

          if [[ "${MIGRATION_REF}" == "develop" ]] ||
             [[ "${MIGRATION_REF}" == fix/* ]] ||
             [[ "${MIGRATION_REF}" == feat/* ]] ||
             [[ "${MIGRATION_REF}" == chore/* ]] ||
             [[ "${MIGRATION_REF}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Manual migration ref accepted: ${MIGRATION_REF}"
          else
            echo "migration_ref must be develop, fix/*, feat/*, chore/*, or a full 40-character commit SHA."
            exit 1
          fi

      - name: Checkout migrations
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.migration_ref || github.ref }}

      - name: Show checked out commit
        shell: bash
        run: |
          set -euo pipefail
          echo "Checked out commit: $(git rev-parse HEAD)"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "Manual migration ref: ${MIGRATION_REF}"
          else
            echo "Push ref: ${GITHUB_REF}"
          fi

      - name: Validate staging project ref
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${SUPABASE_PROJECT_REF}" ]]; then
            echo "SUPABASE_PROJECT_REF is missing."
            exit 1
          fi

          if [[ "${SUPABASE_PROJECT_REF}" != "onikyhqhcbmrrlrcirrg" ]]; then
            echo "Refusing to deploy staging migrations to unexpected Supabase project ref."
            exit 1
          fi

          echo "Validated staging Supabase project ref: ${SUPABASE_PROJECT_REF}"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: List migrations
        run: supabase migration list
      - name: Push migrations
        run: supabase db push
